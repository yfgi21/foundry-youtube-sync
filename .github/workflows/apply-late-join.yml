name: Apply late join synchronization patch

on:
  push:
    branches: [main]
    paths:
      - '.patch/**'
      - '.github/workflows/apply-late-join.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply and validate patch
        shell: bash
        run: |
          cat .patch/late-join.part0 .patch/late-join.part1 > /tmp/late-join.patch
          git apply --check /tmp/late-join.patch
          git apply /tmp/late-join.patch
          node --check scripts/main.js
          python -m json.tool module.json >/dev/null
          python -m json.tool lang/en.json >/dev/null
          python -m json.tool lang/fr.json >/dev/null
          test "$(node -p "require('./module.json').version")" = "0.1.2"

      - name: Commit v0.1.2
        shell: bash
        run: |
          rm -rf .patch
          rm -f .github/workflows/apply-late-join.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Foundry YouTube Sync v0.1.2"
          git push
