name: Assemble module source

on:
  push:
    branches: [main]
    paths:
      - '.build/**'
      - '.github/workflows/assemble-source.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble source
        shell: bash
        run: |
          if [ ! -d .build ]; then
            echo "No staged source chunks remain."
            exit 0
          fi
          mkdir -p scripts
          : > scripts/main.js
          for f in .build/main.part*.b64; do
            echo "Decoding $f"
            tr -d '[:space:]' < "$f" | base64 --decode --ignore-garbage >> scripts/main.js
          done
          echo "3e775d0ce351a3cc3508d8f7dabd5f3b7ecd0305dbacf1ab7baa0e401b97f7ee  scripts/main.js" | sha256sum -c -
          rm -rf .build

      - name: Commit assembled source
        shell: bash
        run: |
          if [ ! -f scripts/main.js ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Foundry YouTube Sync v0.1.1 source"
          git push
